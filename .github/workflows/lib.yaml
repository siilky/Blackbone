name: Library
on:
  push:
    paths:
    - '.github/**'
    - 'scripts/**'
    - 'src/**'
    - '!src/BlackBoneDrv/**'

jobs:
  library:
    name: Build and test library
    strategy:
      matrix:
        arch: [x86, x64]
        preset: [static-mt, static-md, dll]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Build and test
        shell: pwsh
        run: ./scripts/build.ps1 -Arch ${{ matrix.arch }} -Preset ${{ matrix.preset }} -Test
